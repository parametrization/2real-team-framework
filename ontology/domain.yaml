# Semantic overlay — DOMAIN entities of the 2real-team-framework.
#
# The nouns of the framework's problem domain: simulating a software team and the process
# scaffolding (config, hooks, lifecycle, ontology) that travels with a repo. Hand-curated;
# tracked by checksums.json (edit -> dirty -> /ontology-rebuild reconciles vs code).

version: 1

entities:
  - name: FrameworkConfig
    summary: The single shared-config object every genericised artifact reads. Installed at .claude/framework.config.json.
    identity: One per repo (the file the loader finds by walking up from cwd).
    relationships:
      - "validated by: framework/config/framework.config.schema.json"
      - "shadowed by: _framework_config._DEFAULTS (runtime fallback)"
      - "read by: every Hook, every lifecycle/ontology lib"
    invariants:
      - "version == 1."
      - "Missing/malformed config fails open to defaults — never raises, never blocks."
    code: framework/assets/hooks/_framework_config.py

  - name: Hook
    summary: A config-gated check run by a dispatcher at a tool/session event. Pre = blocking, Post/Session = advisory.
    identity: Module name under .claude/hooks/ (no .py), listed in a hooks.* config array.
    relationships:
      - "dispatched by: Dispatcher (pre/post/session)"
      - "ordered by: hooks.pre_bash | post_bash | post_file | session_start"
    invariants:
      - "Stdlib only — runs in a fresh checkout with no install step."
      - "Exposes check(input_data) -> dict | None."
      - "Advisory hooks never block; a raising hook is swallowed (fail-open)."
    code: framework/assets/hooks/

  - name: Dispatcher
    summary: Single in-process entry point that runs the configured hooks for one event.
    identity: dispatcher.py (PreToolUse) / post_dispatcher.py (PostToolUse) / start_dispatcher.py (SessionStart).
    relationships:
      - "runs: Hook[] from the matching hooks.* config list"
      - "wired into: .claude/settings.json by bootstrap.merge_settings"
    invariants:
      - "PreToolUse may block (exit 2); Post/Session are advisory (always exit 0)."

  - name: Team
    summary: The simulated software team all work is executed through (manager, tech lead, engineers, QA).
    identity: The roster under .claude/team/ (roster.json + per-member cards).
    relationships:
      - "has members: TeamMember[]"
      - "governed by: Charter"
      - "generated by: roster_gen"
      - "records: FeedbackLog"
    invariants:
      - "No work begins without the team; commits attribute a TeamMember + Claude."

  - name: TeamMember
    summary: A simulated persona with a role, level, git identity, and personality card.
    identity: Agent name (kebab) + roster card file; git identity (user.name/email).
    relationships:
      - "member of: Team"
      - "commits as: per-commit -c user.name/user.email (never global git config)"
    invariants:
      - "Commits carry two Co-Authored-By trailers (member + Claude)."

  - name: Charter
    summary: The rules of engagement for the team — identity, worktrees, approval gates, release process.
    code: .claude/team/charter.md

  - name: Wave
    summary: A unit of iteration (a batch of stories) with a lifecycle state and a merge model.
    identity: Monotonic wave id allocated by the lifecycle state machine.
    relationships:
      - "tracked in: LifecycleState (.claude/state.json)"
      - "uses: MergeModel (wave-branch | direct-to-main)"
    code: framework/assets/lib/lifecycle.py

  - name: LifecycleState
    summary: The wave/iteration state machine — monotonic allocation, phase transitions, reachability classification.
    code: framework/assets/lib/lifecycle.py

  - name: Ontology
    summary: A two-layer self-knowledge base — hand-curated semantic overlay + generated structural index.
    identity: paths.ontology (default ontology/).
    relationships:
      - "semantic overlay: domain.yaml, services.yaml, conventions.md (tracked by Checksums)"
      - "structural index: structural/code-graph.json + llms.txt (generated by ontology_gen)"
      - "kept fresh by: ontology_refresh SessionStart hook"
      - "reconciled by: /ontology-rebuild; read by /ontology-librarian"
    invariants:
      - "Structural layer is regenerated wholesale, never hand-edited."
      - "Both hooks are INERT unless the ontology dir exists."

  - name: Checksums
    summary: Per-overlay-file SHA tracking; last_tracked != last_resolved means a file is dirty.
    code: framework/assets/hooks/ontology_tracker.py

  - name: Skill
    summary: A slash-command capability (markdown SKILL.md) deployed to .claude/skills/.
    relationships:
      - "examples: session-start, handoff, wave-start/wave-end, ontology-librarian/rebuild, plan-phase, retro"

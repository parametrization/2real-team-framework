name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1, newer than the npm
      # bundled with Node 20. Pin to the 11.x line rather than @latest: npm 12
      # dropped Node 20 support (requires Node >= 22), so `npm@latest` fails
      # EBADENGINE on this runner. ^11.5.1 stays OIDC-capable and Node-20-safe.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g "npm@^11.5.1"

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Build
        working-directory: node
        run: npm run build

      # No NODE_AUTH_TOKEN: authentication is via OIDC trusted publishing
      # (configured on npmjs.com for this repo + workflow). Provenance is
      # generated automatically from the GitHub Actions OIDC identity.
      - name: Publish
        working-directory: node
        run: npm publish --provenance --access public
